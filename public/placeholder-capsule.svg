<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="An old photograph, a handwritten note and a pen on a table">
  <!--
    Documentary-style placeholder, drawn rather than photographed.
    Build Brief §2.5: no corporate stock. Replace with a real contributor
    photograph via Studio → click the picture, or theme/site.json.
  -->
  <rect width="640" height="480" fill="#F3E8DE"/>

  <g fill="none" stroke="#8A5A3B" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" opacity="0.62">
    <!-- table edge -->
    <path d="M0 372 H640" stroke-width="1.5" opacity="0.5"/>

    <!-- photograph, slightly askew, with its white border -->
    <g transform="rotate(-6 300 220)">
      <rect x="150" y="112" width="300" height="232" rx="4" fill="#FFFFFF" stroke="#8A5A3B"/>
      <rect x="164" y="126" width="272" height="176" rx="2" fill="#FAF8F5"/>
      <!-- two figures, deliberately unresolved -->
      <circle cx="258" cy="196" r="24"/>
      <path d="M222 268a36 36 0 0 1 72 0"/>
      <circle cx="342" cy="204" r="20"/>
      <path d="M312 268a30 30 0 0 1 60 0"/>
      <path d="M164 246c28-18 52-6 74 6" opacity="0.45"/>
    </g>

    <!-- folded note with handwriting -->
    <g transform="rotate(4 470 330)">
      <path d="M396 286h148v104H396z" fill="#FFFFFF"/>
      <path d="M414 312h108M414 332h108M414 352h72" stroke-width="1.75" opacity="0.7"/>
    </g>

    <!-- pen -->
    <g transform="rotate(-24 220 400)">
      <path d="M150 398h128" stroke-width="6" stroke-linecap="round"/>
      <path d="M278 398l22 0" stroke-width="3"/>
    </g>

    <!-- spectacles, folded -->
    <g opacity="0.55" transform="translate(58 96)">
      <circle cx="26" cy="26" r="17"/>
      <circle cx="70" cy="26" r="17"/>
      <path d="M43 26h10M87 22l22-10M9 22L-9 12"/>
    </g>
  </g>
</svg>
